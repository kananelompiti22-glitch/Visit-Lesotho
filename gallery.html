<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Visit Lesotho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background-color: #0E6E45;">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.jpeg" alt="Visit Lesotho" height="40" class="d-inline-block align-text-top me-2">
                <div class="d-inline-block">
                    Visit Lesotho<br>
                    <small style="font-size: 0.7rem; color: #d0d0d0;">Kingdom in the Sky</small>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="destinations.html">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<main class="pt-5">
    <section class="py-5">
        <div class="container">
            <div class="text-center mb-5">
                <h1 class="display-4">Moments in Lesotho 📸</h1>
                <p class="lead text-muted">Beauty captured through the lens</p>
            </div>

            <div class="filter-buttons text-center mb-4">
                <button class="btn filter-btn active" data-filter="all">All</button>
                <button class="btn filter-btn" data-filter="mountains">Mountains</button>
                <button class="btn filter-btn" data-filter="culture">Culture</button>
                <button class="btn filter-btn" data-filter="water">Water</button>
                <button class="btn filter-btn" data-filter="sunset">Sunsets</button>
            </div>

            <div class="row g-3" id="galleryGrid">
                <div class="col-6 col-md-4 col-lg-3 gallery-item" data-category="mountains">
                    <img src="images/gallery1.jpg" class="img-fluid gallery-img" alt="Mountain peaks" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6 col-md-4 col-lg-3 gallery-item" data-category="culture">
                    <img src="images/gallery2.jpg" class="img-fluid gallery-img" alt="Basotho blanket" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6 col-md-4 col-lg-3 gallery-item" data-category="water">
                    <img src="images/gallery3.jpg" class="img-fluid gallery-img" alt="Waterfall" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6 col-md-4 col-lg-3 gallery-item" data-category="sunset">
                    <img src="images/gallery4.jpg" class="img-fluid gallery-img" alt="Golden sunset" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6 col-md-4 col-lg-3 gallery-item" data-category="mountains">
                    <img src="images/gallery5.jpg" class="img-fluid gallery-img" alt="Snowy peaks" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6 col-md-4 col-lg-3 gallery-item" data-category="culture">
                    <img src="images/gallery6.jpg" class="img-fluid gallery-img" alt="Traditional village" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6 col-md-4 col-lg-3 gallery-item" data-category="water">
                    <img src="images/gallery7.jpg" class="img-fluid gallery-img" alt="Katse Dam blue water" onclick="openLightbox(this.src)">
                </div>
                <div class="col-6 col-md-4 col-lg-3 gallery-item" data-category="sunset">
                    <img src="images/gallery8.jpg" class="img-fluid gallery-img" alt="Sunset over mountains" onclick="openLightbox(this.src)">
                </div>
            </div>
        </div>
    </section>
</main>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
    <span class="close-btn">&times;</span>
    <img id="lightbox-img" src="" alt="Enlarged photo">
</div>

<footer class="bg-dark text-white py-4">
    <div class="container text-center">
        <img src="images/logo.jpeg" alt="Visit Lesotho" style="height: 60px; margin-bottom: 10px;">
         <p class="mb-2 fs-5"><strong>Visit Lesotho</strong></p>
         <p class="small text-warning fst-italic">"Kingdom in the Sky"</p>
        <p class="small text-warning fst-italic">Where every mountain tells a story ❤️</p>
        <div class="social-icons mb-3">
            <a href="#" class="text-white me-2"><i class="fab fa-facebook fa-lg"></i></a>
            <a href="#" class="text-white me-2"><i class="fab fa-instagram fa-lg"></i></a>
            <a href="#" class="text-white me-2"><i class="fab fa-twitter fa-lg"></i></a>
            <a href="#" class="text-white"><i class="fab fa-youtube fa-lg"></i></a>
        </div>
        <p class="small">&copy; 2026 Lesotho Tourism. All Rights Reserved.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>
